name: Android APK

# Builds the same signed debug APK as ./build.sh and attaches it to a GitHub Release.
# Triggers:
#  - pushing a tag like v0.3  -> release "v0.3"
#  - pushing a commit that changes VERSION and whose message contains "[release]"
#    -> release "v<VERSION>" (created if missing)
#  - manual run (workflow_dispatch): BUILD ONLY by default - the APK is attached to the run as an
#    artifact and nothing is published. Tick "publish" to also create/update the release.
# Every run verifies that the APK is signed with the same certificate as v1.0-v1.0.x
# (EXPECTED_CERT_SHA256), so an APK that Android would refuse to install over an existing
# install can never be published or handed out. The debug keystore lives only in the Actions cache.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish/update the GitHub release (off = build only, APK as run artifact)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TOOLS_DIR: ${{ github.workspace }}/.toolchain
      # SHA-256 of the signing certificate of every release so far (v0.1 ... v1.0). Public value.
      EXPECTED_CERT_SHA256: 75c3e1fd88c93163d67a34f4d680d5b93442806e9510a14087cef59d08492178
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache toolchain (holds the debug signing keystore)
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            .toolchain
            ~/.local/share/godot/export_templates
          key: toolchain-${{ hashFiles('tools/setup_toolchain.sh') }}

      - name: Build APK (setup + import + tests + export)
        run: |
          export ANDROID_SDK_ROOT="$TOOLS_DIR/android-sdk"
          ./build.sh

      - name: Verify signing certificate matches v1.0
        run: |
          echo "toolchain cache hit: ${{ steps.toolchain-cache.outputs.cache-hit }}"
          APK=$(ls build/DiscChaos-v*.apk | head -1)
          GOT=$("$TOOLS_DIR/android-sdk/build-tools/35.0.1/apksigner" verify --print-certs "$APK" 2>/dev/null \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "APK:      $APK"
          echo "got:      $GOT"
          echo "expected: $EXPECTED_CERT_SHA256"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with a different key than v1.0 (toolchain cache miss?). Android would refuse to update an existing install with it. Not publishing or uploading."
            exit 1
          fi

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APK=$(ls build/DiscChaos-v*.apk | head -1)
          NOTES=$(awk "/^### ${TAG}\$/{f=1;next} /^### /{f=0} f" CHANGELOG.md || true)
          [ -z "$NOTES" ] && NOTES="DISC CHAOS ${TAG} — Android debug APK (arm64)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "DISC CHAOS $TAG" --notes "$NOTES"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DiscChaos-apk
          path: build/DiscChaos-v*.apk
          if-no-files-found: error
          retention-days: 14
