name: Android APK

# Builds the same signed debug APK as ./build.sh and attaches it to a GitHub Release.
# Triggers:
#  - pushing a tag like v0.3  -> release "v0.3"
#  - pushing a commit that changes VERSION -> release "v<VERSION>" (created if missing)
#  - manual run (workflow_dispatch)
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TOOLS_DIR: ${{ github.workspace }}/.toolchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            .toolchain
            ~/.local/share/godot/export_templates
          key: toolchain-${{ hashFiles('tools/setup_toolchain.sh') }}

      - name: Build APK (setup + import + tests + export)
        run: |
          export ANDROID_SDK_ROOT="$TOOLS_DIR/android-sdk"
          ./build.sh

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APK=$(ls build/DiscChaos-v*.apk | head -1)
          NOTES=$(awk "/^### ${TAG}\$/{f=1;next} /^### /{f=0} f" CHANGELOG.md || true)
          [ -z "$NOTES" ] && NOTES="DISC CHAOS ${TAG} — Android debug APK (arm64)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "DISC CHAOS $TAG" --notes "$NOTES"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DiscChaos-apk
          path: build/DiscChaos-v*.apk
